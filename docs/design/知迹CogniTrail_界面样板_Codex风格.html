<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知迹 CogniTrail · 界面样板（白色 · Codex 风格）</title>
<style>
  :root{
    --bg-app:#f7f7f8;          /* 侧栏底 */
    --bg-main:#ffffff;         /* 主区底 */
    --bg-raise:#f4f4f5;        /* 卡片 / 浮起 */
    --bg-hover:#f0f0f1;
    --bg-active:#ececee;
    --line:#e6e6e8;
    --line-soft:#efeff1;
    --ink:#18181b;
    --ink-2:#52525b;
    --ink-3:#71717a;
    --ink-4:#a1a1aa;
    --dark:#18181b;
    --ok:#15803d;      --ok-bg:rgba(21,128,61,.09);
    --warn:#b45309;    --warn-bg:rgba(180,83,9,.09);
    --danger:#dc2626;  --danger-bg:rgba(220,38,38,.08);
    --src-codex:#71717a;
    --src-wb:#19c37d;
    --src-claude:#d97757;
    --r-lg:12px; --r-md:10px; --r-sm:8px;
    --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
    --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);font-size:13.5px;line-height:1.6;
    background:var(--bg-main);color:var(--ink);
    display:grid;grid-template-columns:300px 1fr;overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .mono{font-family:var(--mono)}

  /* ============ 左栏 ============ */
  .left{background:var(--bg-app);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
  .brand .logo{width:26px;height:26px;border-radius:8px;background:var(--dark);color:#ffffff;
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
  .brand b{font-size:14px;font-weight:600;letter-spacing:.01em}
  .brand .proj{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;
    padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--bg-main)}
  .brand .proj:hover{background:var(--bg-hover);color:var(--ink-2)}

  .label{font-size:11px;letter-spacing:.09em;color:var(--ink-4);padding:0 6px;margin:4px 0 8px}

  .actions{padding:4px 12px 14px;border-bottom:1px solid var(--line-soft)}
  .btn-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--dark);color:#ffffff;font-weight:600;font-size:13px;
    padding:10px 12px;border-radius:var(--r-md);transition:background .15s}
  .btn-primary:hover{background:#2e2e33}
  .btn-primary svg{width:15px;height:15px}
  .action-row{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:2px;
    border-radius:var(--r-sm);color:var(--ink-2);transition:background .12s,color .12s;text-align:left}
  .action-row:hover{background:var(--bg-hover);color:var(--ink)}
  .action-row svg{width:15px;height:15px;flex:0 0 auto;stroke:currentColor}
  .action-row .k{flex:1;font-size:13px}
  .action-row .hint{font-size:11px;color:var(--ink-4)}
  .act-group{margin-top:14px}
  .act-group:first-of-type{margin-top:10px}

  .sessions{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 8px 8px}
  .sess-head{display:flex;align-items:center;padding:0 10px;margin-bottom:6px}
  .sess-head .count{margin-left:auto;font-size:11px;color:var(--ink-4);font-family:var(--mono)}
  .sess-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
  .sess{display:flex;flex-direction:column;gap:3px;padding:9px 10px;border-radius:var(--r-md);
    cursor:pointer;transition:background .12s;border:1px solid transparent;background:transparent}
  .sess:hover{background:var(--bg-hover)}
  .sess.on{background:var(--bg-active);border-color:#d4d4d8}
  .sess .r1{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}
  .sess .dot{width:7px;height:7px;border-radius:99px;flex:0 0 auto}
  .sess .r1 .t{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-4)}
  .sess .r2{font-size:12.8px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess.on .r2{color:var(--ink)}
  .left-foot{padding:8px 16px 12px;font-size:11px;color:var(--ink-4);display:flex;justify-content:space-between}

  /* ============ 主区 ============ */
  .main{display:flex;flex-direction:column;min-height:0;min-width:0}
  .topbar{height:54px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line)}
  .crumb{font-size:13.5px;font-weight:600}
  .crumb .n{color:var(--ink-3);font-weight:400;font-size:12.5px;margin-left:8px}
  .topbar .sp{flex:1}
  .seg{display:flex;background:var(--bg-raise);border:1px solid var(--line);border-radius:99px;padding:2px}
  .seg button{padding:4px 12px;border-radius:99px;font-size:12px;color:var(--ink-3)}
  .seg button.on{background:#e4e4e7;color:var(--ink)}
  .iconbtn{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r-sm);
    border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;transition:background .12s,color .12s;background:var(--bg-main)}
  .iconbtn:hover{background:var(--bg-hover);color:var(--ink)}
  .iconbtn svg{width:14px;height:14px;stroke:currentColor}

  .audit{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:11px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:500}
  .badge .bd{width:7px;height:7px;border-radius:99px}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.danger{background:var(--danger-bg);color:var(--danger)}
  .stat{display:flex;align-items:baseline;gap:6px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--ink-3);cursor:pointer;background:var(--bg-main)}
  .stat:hover{background:var(--bg-hover)}
  .stat b{color:var(--ink);font-family:var(--mono);font-weight:600;font-size:12.5px}
  .stat .sub{color:var(--ink-4)}
  .flag{display:inline-flex;align-items:center;gap:8px;padding:4px 11px;border-radius:var(--r-sm);
    background:var(--danger-bg);color:var(--danger);font-size:12px;cursor:pointer}
  .flag:hover{background:rgba(220,38,38,.15)}
  .flag .mono{font-size:11px;opacity:.75}

  .detail{flex:1;min-height:0;overflow-y:auto;padding:26px 34px 30px}
  .detail-inner{max-width:820px;margin:0 auto}
  .d-crumb{font-size:12px;color:var(--ink-4);margin-bottom:10px}
  .d-crumb .mono{color:var(--ink-3)}
  .d-head{display:flex;align-items:flex-start;gap:14px}
  .d-title{font-size:19px;font-weight:600;line-height:1.45;flex:1}
  .d-copy{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-sm);
    border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;background:var(--bg-main)}
  .d-copy:hover{background:var(--bg-hover);color:var(--ink)}
  .d-copy svg{width:13px;height:13px;stroke:currentColor}
  .d-tags{display:flex;align-items:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
  .tag{font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3);background:var(--bg-main)}
  .tag.key{background:var(--ok-bg);border-color:transparent;color:var(--ok);font-weight:500}
  .tag.gone{color:var(--ink-4)}
  .tag .dot{width:6px;height:6px;border-radius:99px;display:inline-block;margin-right:6px;vertical-align:1px}
  .coord{font-family:var(--mono);font-size:11.5px;padding:3px 10px;border-radius:6px;background:var(--bg-raise);
    border:1px solid var(--line);color:var(--ink-2);cursor:pointer}
  .coord:hover{background:var(--bg-hover);color:var(--ink)}

  .sec{margin-top:22px}
  .sec .k{font-size:11px;letter-spacing:.09em;color:var(--ink-4);margin-bottom:7px}
  .sec .v{font-size:13.5px;color:var(--ink);line-height:1.75}
  .alts{display:flex;flex-direction:column;gap:7px}
  .alt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line-soft);
    border-radius:var(--r-md);background:var(--bg-raise)}
  .alt .no{flex:0 0 auto;font-size:11px;color:var(--ink-4);padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin-top:1px;background:var(--bg-main)}
  .alt .tx{font-size:12.8px;color:var(--ink-2)}
  .alt .wy{font-size:11.5px;color:var(--ink-4);margin-top:2px}

  .evidence{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .ev-head{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg-raise);border-bottom:1px solid var(--line)}
  .ev-head .t{font-size:11px;letter-spacing:.08em;color:var(--ink-4)}
  .ev-head .mono{font-size:11.5px;color:var(--ink-2)}
  .ev-head button{margin-left:auto;font-size:11.5px;color:var(--ink-3);padding:3px 9px;border-radius:6px}
  .ev-head button:hover{background:var(--bg-hover);color:var(--ink)}
  .ev-body{padding:14px 16px;font-family:var(--mono);font-size:12.3px;line-height:1.7;color:#3f3f46;
    white-space:pre;overflow-x:auto;background:#fafafa}
  .ev-body .hl{background:rgba(21,128,61,.07);display:block;margin:0 -16px;padding:0 16px;color:var(--ink)}

  .chain{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;background:var(--bg-raise)}
  .chain .k{font-size:11px;letter-spacing:.09em;color:var(--ink-4);margin-bottom:10px}
  .chain .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.8px}
  .chain .old{color:var(--ink-4);text-decoration:line-through}
  .chain .why{font-size:11.5px;color:var(--warn);padding:2px 9px;border-radius:99px;background:var(--warn-bg)}
  .chain .now{color:var(--ink)}
  .chain .arr{color:var(--ink-4)}

  /* ============ 右下：卡片摘要 ============ */
  .summary{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg-app);padding:12px 20px 14px}
  .sum-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .sum-head .t{font-size:12.5px;font-weight:600}
  .sum-head .c{font-size:11.5px;color:var(--ink-4)}
  .sum-head .more{margin-left:auto;font-size:12px;color:var(--ink-3)}
  .sum-head .more:hover{color:var(--ink)}
  .sum-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
  .sum-card{flex:0 0 256px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-main);
    padding:11px 13px;cursor:pointer;transition:border-color .12s,background .12s}
  .sum-card:hover{border-color:#c8c8cd}
  .sum-card.on{border-color:#8e8e93;box-shadow:0 0 0 1px #8e8e93 inset}
  .sum-card .r1{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-bottom:7px;overflow:hidden}
  .sum-card .dot{width:6px;height:6px;border-radius:99px;flex:0 0 auto}
  .sum-card .stg{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum-card .r1 .st{margin-left:auto;flex:0 0 auto;font-size:10.5px}
  .sum-card .st.sup{color:var(--ink-4)}
  .sum-card .st.drop{color:var(--danger)}
  .sum-card .tt{font-size:12.6px;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sum-card.on .tt{color:var(--ink)}
  .sum-card .mt{margin-top:8px;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--ink-4)}
  .sum-card .tchip{font-family:var(--sans);font-size:10.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-3);flex:0 0 auto}
  .sum-card .tchip.key{background:var(--ok-bg);border-color:transparent;color:var(--ok)}

  /* ============ 抽屉 ============ */
  .overlay{position:fixed;inset:0;background:rgba(24,24,27,.22);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:92vw;background:#ffffff;
    border-left:1px solid var(--line);transform:translateX(102%);transition:transform .24s ease;z-index:50;
    display:flex;flex-direction:column}
  body.drawer-open .overlay{opacity:1;pointer-events:auto}
  body.drawer-open .drawer{transform:translateX(0)}
  .dw-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .dw-head .t{font-size:13.5px;font-weight:600}
  .dw-head .sub{font-size:11.5px;color:var(--ink-4)}
  .dw-head .x{margin-left:auto;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
  .dw-head .x:hover{background:var(--bg-hover);color:var(--ink)}
  .dw-body{flex:1;overflow-y:auto;padding:16px 18px}

  .logline{display:flex;gap:10px;padding:7px 10px;border-radius:var(--r-sm);font-family:var(--mono);font-size:11.8px;line-height:1.6}
  .logline:hover{background:var(--bg-hover)}
  .logline .tm{color:var(--ink-4);flex:0 0 62px}
  .logline .tx{color:var(--ink-2)}
  .logline.bad .tx{color:var(--danger)}
  .logline.ok .tx{color:var(--ok)}

  .set-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
  .set-row .k{font-size:13px}
  .set-row .s{font-size:11.5px;color:var(--ink-4)}
  .set-row .sp{flex:1}
  .switch{width:34px;height:20px;border-radius:99px;background:#d4d4d8;position:relative;transition:background .15s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:#ffffff;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .switch.on{background:var(--ok)}
  .switch.on::after{left:16px;background:#ffffff}
  .radio{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  .radio .rc{width:15px;height:15px;border-radius:99px;border:1.5px solid var(--ink-4);display:inline-block;position:relative}
  .radio.on .rc{border-color:var(--dark)}
  .radio.on .rc::after{content:"";position:absolute;inset:3px;border-radius:99px;background:var(--dark)}
  .keybox{display:flex;gap:8px;margin-top:8px}
  .keybox input{flex:1;background:var(--bg-raise);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:8px 11px;color:var(--ink);font-family:var(--mono);font-size:12px;outline:none}
  .keybox input:focus{border-color:#c8c8cd}
  .mini-btn{padding:7px 13px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:12px;color:var(--ink-2);background:var(--bg-main)}
  .mini-btn:hover{background:var(--bg-hover);color:var(--ink)}
  .mini-btn.solid{background:var(--dark);color:#ffffff;border-color:var(--dark);font-weight:600}
  .mini-btn.solid:hover{background:#2e2e33}

  .rp{font-size:13px;line-height:1.8;color:var(--ink-2)}
  .rp h4{font-size:13.5px;color:var(--ink);margin:16px 0 6px;font-weight:600}
  .rp h4:first-child{margin-top:0}
  .rp ol{padding-left:20px}
  .rp li{margin:4px 0}
  .rp .note{font-size:11.5px;color:var(--ink-4);border-top:1px solid var(--line-soft);padding-top:10px;margin-top:16px}
  .rp .del{color:var(--ink-4);text-decoration:line-through}
</style>
</head>
<body>

<!-- ================= 左栏 ================= -->
<aside class="left">
  <div class="brand">
    <div class="logo">迹</div>
    <b>知迹</b>
    <button class="proj">知迹 CogniTrail ▾</button>
  </div>

  <div class="actions">
    <div class="act-group">
      <div class="label">记录</div>
      <button class="btn-primary" onclick="toast('已生成 2 张卡片（1 条被证据闸门丢弃）')">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
        生成这一段的决策
      </button>
      <button class="action-row" onclick="openDrawer('report')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M17 15l3 3-3 3" transform="translate(0,-4)"/></svg>
        <span class="k">整理决策</span><span class="hint">排序 · 融合 · 演进链</span>
      </button>
      <button class="action-row" onclick="openDrawer('report')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span class="k">总结工作流</span><span class="hint">要求 · 经过 · 名词</span>
      </button>
      <button class="action-row" onclick="toast('正在唤起本机 claude …（只问答，不改文件）')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 1 1-3.2-6.4L21 4l-1 4.2c.6 1.1 1 2.4 1 3.8z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>
        <span class="k">和 AI 对话</span><span class="hint">用你本机已登录的 CLI</span>
      </button>
    </div>

    <div class="act-group">
      <div class="label">查看</div>
      <button class="action-row" onclick="toast('决策面板已在浏览器打开（43 条）')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="k">打开决策面板</span><span class="hint">网页版 · 可分享</span>
      </button>
      <button class="action-row" onclick="openDrawer('log')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>
        <span class="k">日志</span><span class="hint" id="log-badge">3 条新</span>

      <div class="sec"><div class="k">为什么这么定</div><div class="v">${c.why[state.tone]}</div></div>
      ${alts ? `<div class="sec"><div class="k">还考虑过什么</div><div class="alts">${alts}</div></div>` : ""}
      <div class="sec"><div class="k">代价与风险</div><div class="v">${c.risk[state.tone]}</div></div>
      <div class="evidence">
        <div class="ev-head"><span class="t">证据</span><span class="mono">${c.file}:${c.lines}</span>
          <button onclick="toast('在文件里打开：${c.file}')">在文件里打开</button></div>
        <div class="ev-body"><span class="hl">${escapeHtml(c.quote)}</span></div>
      </div>
      ${chain}
      <div style="margin-top:22px;font-size:11.5px;color:var(--ink-4)">
        专家细节（默认折叠）：状态 active · 写法 ${state.tone==="pro"?"专家模式":"小白模式"} · 卡片文件 docs/decisions/ · 坐标已由脚本回文件核对
      </div>
    </div>`;
}

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function pickSession(id){ state.sess = id; const first = CARDS.find(c=>c.sid===id); state.card = first ? first.id : null; renderAll(); }
function pickCard(id){ state.card = id; renderAll(); }
function renderAll(){ renderSessions(); renderSummary(); renderDetail(); }

/* ---------------- 抽屉 ---------------- */
const DRAWERS = {
  log:{ t:"日志", s:"最近 5 分钟 · 可选中复制", html(){
      return LOGS.map(l=>`<div class="logline ${l.bad?"bad":l.ok?"ok":""}"><span class="tm">${l.tm}</span><span class="tx">${l.tx}</span></div>`).join("");
  }},
  report:{ t:"整理决策", s:"按逻辑排序 · 融合冲突 · 演进链", html(){ return `<div class="rp">${REPORT}</div>`; }},
  settings:{ t:"设置", s:"保存即生效，不用重启", html(){ return SETTINGS; }},
};
function openDrawer(key){
  const d = DRAWERS[key];
  $("#dw-title").textContent = d.t; $("#dw-sub").textContent = d.s;
  $("#dw-body").innerHTML = d.html();
  document.body.classList.add("drawer-open");
  if(key==="log") $("#log-badge").textContent = "已读";
}
function closeDrawer(){ document.body.classList.remove("drawer-open"); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });

/* ---------------- 写法两档 ---------------- */
$("#tone-seg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.tone = b.dataset.tone;
  document.querySelectorAll("#tone-seg button").forEach(x=>x.classList.toggle("on", x===b));
  const rp = $("#r-plain"), rx = $("#r-pro");
  if(rp&&rx){ rp.classList.toggle("on", state.tone==="plain"); rx.classList.toggle("on", state.tone==="pro"); }
  renderSummary(); renderDetail();
});
document.addEventListener("click", e=>{
  const r = e.target.closest(".radio"); if(!r) return;
  state.tone = r.id==="r-pro" ? "pro" : "plain";
  document.querySelectorAll("#tone-seg button").forEach(x=>x.classList.toggle("on", x.dataset.tone===state.tone));
  document.querySelectorAll(".radio").forEach(x=>x.classList.toggle("on", x===r));
  renderSummary(); renderDetail();
});

/* ---------------- 轻提示 ---------------- */
let toastTimer=null;
function toast(msg){
  let el = $("#toast");
  if(!el){ el = document.createElement("div"); el.id="toast";
    el.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#18181b;color:#ffffff;padding:9px 16px;border-radius:99px;font-size:12.5px;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.18);transition:opacity .2s";
    document.body.appendChild(el); }
  el.textContent = msg; el.style.opacity = "1";
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.style.opacity="0"; }, 2200);
}

/* 开关（设置抽屉里的小开关） */
document.addEventListener("click", e=>{
  const sw = e.target.closest(".switch"); if(sw) sw.classList.toggle("on");
});

renderAll();
</script>
</body>
</html>
